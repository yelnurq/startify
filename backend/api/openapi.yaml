openapi: 3.1.0
info:
  title: Qadam API
  version: 0.6.0
  summary: AI-платформа инновационной и проектной деятельности университета.
  description: |
    Qadam ведёт студента от идеи к структурированному проекту, публичной витрине,
    Demo Day и выходу на рынок, а руководству вуза даёт измеримые результаты.

    ## Conventions
    - Every path is served under `/api/v1`. The tenant (university) is resolved from the
      host name: `kazutb.qadam.kz` or a custom domain of the university.
    - Authentication uses an httpOnly session cookie (`qadam_at`) refreshed with
      `POST /auth/refresh`. State-changing requests must echo the `qadam_csrf` cookie in the
      `X-CSRF-Token` header.
    - Errors use RFC 9457 Problem Details (`application/problem+json`) with a stable,
      localisable `code` (for example `auth.invalid_credentials`).
    - Collections use cursor pagination: pass `cursor` from `next_cursor` of the previous page.
    - Creating requests accept an `Idempotency-Key` header; a repeated key replays the
      original response (`Idempotent-Replayed: true`).
    - Optimistic locking: shared editable resources return an `ETag`; an update sent with
      `If-Match` fails with 412 `precondition.failed` when the resource changed meanwhile.
  contact:
    name: Qadam
    url: https://qadam.kz
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: system
    description: Platform metadata and service information.
  - name: tenant
    description: The university the request is addressed to.
  - name: auth
    description: Registration, sign-in (password, e-mail code, SSO), sessions.
  - name: me
    description: The signed-in user, onboarding and profile.
  - name: profiles
    description: Public profiles.
  - name: files
    description: Uploaded files.
  - name: structure
    description: Faculties, departments and study groups of the university.
  - name: team
    description: The "looking for teammates" board.
  - name: admin
    description: University administration (tenant administrators).
  - name: ai
    description: Language models - status, university settings, usage, connection check.
  - name: knowledge
    description: The university knowledge base the AI mentor cites.
  - name: projects
    description: Projects, their teams, activity and presence.
  - name: incubator
    description: Steps of the incubator, history, comments, the AI mentor and pitch materials.
  - name: evaluation
    description: AI evaluation of projects by the university's rubric, expert corrections, reports.
  - name: showcase
    description: The public showcase of projects, its moderation and contact requests.
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [system]
      summary: Platform metadata
      description: Public build and localisation metadata used by the web client on start-up.
      security: []
      responses:
        "200":
          description: Platform metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"

  /tenant:
    get:
      operationId: getCurrentTenant
      tags: [tenant]
      summary: The university of this host
      description: Public branding, sign-up rules and SSO providers, needed before sign-in.
      security: []
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        default:
          $ref: "#/components/responses/Problem"

  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Current session
      description: The signed-in user and their membership in this university, or 401 `auth.unauthenticated`.
      responses:
        "200":
          description: Active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register with e-mail and password
      description: |
        Creates the account and a student membership and e-mails a verification link; no session
        starts until the link is opened (`POST /auth/email/verify`). Registering again with the
        address of an account whose e-mail is not verified yet replaces its password, ends its
        sessions and sends a new link: whoever controls the mailbox gets the account. An account with
        a verified e-mail joins this university with its right password (and is signed in); the
        attempts count towards the same per-address limit as `POST /auth/login`.
        Errors: `auth.email_taken` (409), `auth.signup_disabled` and `auth.email_domain_not_allowed` (403),
        `auth.consent_required`, `auth.password_weak` (422), `auth.too_many_attempts` (429).
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: An existing account with a verified e-mail joined this university and is signed in; session cookies are set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "202":
          description: Registered; the verification link is on its way and no session is started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSent"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with e-mail and password
      description: |
        Errors: `auth.invalid_credentials` (401), `auth.email_unverified` (403, the password is right but
        the e-mail is not verified yet: no session starts, `POST /auth/email/resend` sends the link again),
        `auth.not_a_member`, `auth.account_suspended` (403), `auth.too_many_attempts` (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; session cookies are set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/otp/request:
    post:
      operationId: requestLoginCode
      tags: [auth]
      summary: E-mail a one-time sign-in code
      description: Always answers 202 so that the response does not reveal whether the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If the address is registered, a code is on its way.
        default:
          $ref: "#/components/responses/Problem"

  /auth/otp/verify:
    post:
      operationId: verifyLoginCode
      tags: [auth]
      summary: Sign in with the e-mailed code
      description: "Errors: `auth.code_invalid` (401), `auth.too_many_attempts` (429)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCodeRequest"
      responses:
        "200":
          description: Signed in; session cookies are set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the session tokens
      description: |
        Uses the refresh cookie. Every refresh rotates the refresh token; presenting an already
        rotated token revokes the whole session (`auth.session_revoked`).
      security: []
      responses:
        "204":
          description: New session cookies are set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of this session
      security: []
      responses:
        "204":
          description: Signed out; session cookies are cleared.
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: Active sessions of the user
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeAllSessions
      tags: [auth]
      summary: Sign out everywhere
      description: Revokes every other session of the user, in every university of the account; this one stays.
      responses:
        "204":
          description: The other sessions are revoked.
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked.
        default:
          $ref: "#/components/responses/Problem"

  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm the e-mail address with the token from the letter
      description: |
        Confirms the address and, since opening the link proves control of the mailbox, signs in
        (the link of a new registration leads straight to onboarding). Errors: `auth.token_invalid` (400);
        `auth.account_suspended`, `auth.not_a_member` (403) when the address is confirmed but the
        account may not enter this university; `auth.too_many_attempts` (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Address confirmed and signed in; session cookies are set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/email/resend:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Send the verification letter again
      description: |
        Signed-in members get a new letter for their own address (the body is ignored). Visitors send
        the address: a letter goes to it only if it belongs to a member of this university whose e-mail
        is not verified yet, and the answer is always 202, so it does not reveal whether the address is
        registered. Errors: `validation.failed` (422, a visitor without an address), `auth.too_many_attempts` (429).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If a letter is due, it is on its way.
        default:
          $ref: "#/components/responses/Problem"

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: E-mail a password reset link
      description: Always answers 202 so that the response does not reveal whether the address is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: If the address is registered, a link is on its way.
        default:
          $ref: "#/components/responses/Problem"

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the token from the letter
      description: Revokes every session of the user. Errors `auth.token_invalid`, `auth.password_weak`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password changed.
        default:
          $ref: "#/components/responses/Problem"

  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change the password
      description: |
        Other sessions are revoked, in every university of the account. An account without a password
        (created by single sign-on) sets its first one with an empty `current_password` and a sign-in
        `code` e-mailed by `POST /auth/otp/request`: a session alone must not become a lasting password.
        Errors: `auth.password_incorrect`, `auth.code_invalid`, `auth.password_weak` (422),
        `auth.reauth_required` (403, the code is missing), `auth.too_many_attempts` (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed.
        default:
          $ref: "#/components/responses/Problem"

  /auth/oidc/{providerId}/start:
    get:
      operationId: startOidc
      tags: [auth]
      summary: Start single sign-on with the university identity provider
      security: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: redirect
          in: query
          required: false
          description: Path inside the application to return to after sign-in.
          schema:
            type: string
            maxLength: 512
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /auth/oidc/{providerId}/callback:
    get:
      operationId: completeOidc
      tags: [auth]
      summary: Return from the identity provider
      description: |
        Signs in the account of the identity: a first sign-in links an existing account with the same
        verified address only when it is a member of this university or the address is on one of the
        university's e-mail domains (linking an account whose e-mail was never verified removes its
        password and ends its sessions), otherwise creates one. Failures redirect to
        `/login?error=<code>`: `auth.oidc_failed`, `auth.sso_link_denied`, `auth.not_a_member`,
        `auth.account_suspended`.
      security: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect into the application, signed in (or to the sign-in page with an error).
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user with membership and profile
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update name and interface language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /me/onboarding:
    put:
      operationId: completeOnboarding
      tags: [me]
      summary: Finish onboarding
      description: Stores language, place of study, interests and skills; marks the membership as onboarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /me/profile:
    put:
      operationId: updateProfile
      tags: [me]
      summary: Update the profile
      description: "Errors: `profile.slug_taken` (409)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /me/avatar:
    put:
      operationId: uploadAvatar
      tags: [me]
      summary: Upload a profile photo
      description: |
        JPEG, PNG or WebP up to 5 MB. The image is checked for malware, re-encoded (metadata
        such as GPS position is removed) and scaled to 512 px. Errors: `files.too_large` (413),
        `files.unsupported_type`, `files.infected` (422), `files.scanner_unavailable` (503).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAvatar
      tags: [me]
      summary: Remove the profile photo
      responses:
        "204":
          description: Photo removed.
        default:
          $ref: "#/components/responses/Problem"

  /profiles/{slug}:
    get:
      operationId: getPublicProfile
      tags: [profiles]
      summary: Public profile
      description: Available when the owner made the profile public; otherwise 404 `profile.not_found`.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        default:
          $ref: "#/components/responses/Problem"

  /files/{fileId}/content:
    get:
      operationId: getFileContent
      tags: [files]
      summary: Download a file
      description: Public files (avatars, covers) are available to everyone, others only to permitted users.
      security: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /faculties:
    get:
      operationId: listFaculties
      tags: [structure]
      summary: Faculties with their departments
      security: []
      responses:
        "200":
          description: Faculties sorted by name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Faculty"
        default:
          $ref: "#/components/responses/Problem"

  /study-groups:
    get:
      operationId: listStudyGroups
      tags: [structure]
      summary: Study groups
      parameters:
        - name: faculty_id
          in: query
          schema:
            type: string
            format: uuid
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Prefix of the group code, e.g. `ВТиПО-23`.
          schema:
            type: string
            maxLength: 40
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching groups.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudyGroup"
        default:
          $ref: "#/components/responses/Problem"

  /team-requests:
    get:
      operationId: listTeamRequests
      tags: [team]
      summary: Open requests for teammates
      parameters:
        - name: q
          in: query
          description: Full-text search in title, description and skills.
          schema:
            type: string
            maxLength: 120
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/TeamRole"
        - name: skill
          in: query
          schema:
            type: string
            maxLength: 40
        - name: mine
          in: query
          description: Only requests of the signed-in user, including closed ones.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of requests, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRequestPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeamRequest
      tags: [team]
      summary: Publish a request for teammates
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRequestCreate"
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRequest"
        default:
          $ref: "#/components/responses/Problem"

  /team-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getTeamRequest
      tags: [team]
      summary: One request
      responses:
        "200":
          description: The request.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRequest"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTeamRequest
      tags: [team]
      summary: Edit or close a request
      description: Only the author (or a moderator) may change a request.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRequestUpdate"
      responses:
        "200":
          description: The updated request.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRequest"
        default:
          $ref: "#/components/responses/Problem"

  /team-requests/{requestId}/responses:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listTeamResponses
      tags: [team]
      summary: Replies to a request
      description: The author (and moderators) see every reply with the responder's e-mail; others see only their own.
      responses:
        "200":
          description: Replies, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamResponse"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: respondToTeamRequest
      tags: [team]
      summary: Reply to a request
      description: "Errors: `team.own_request`, `team.already_responded` (409), `team.closed`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamResponseCreate"
      responses:
        "201":
          description: The reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        default:
          $ref: "#/components/responses/Problem"

  /admin/members:
    get:
      operationId: listMembers
      tags: [admin]
      summary: Members of the university
      description: Requires the `tenant_admin` or `innovation_manager` role.
      parameters:
        - name: q
          in: query
          description: Search by name or e-mail.
          schema:
            type: string
            maxLength: 120
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: faculty_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of members sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        default:
          $ref: "#/components/responses/Problem"

  /admin/members/{userId}:
    patch:
      operationId: updateMember
      tags: [admin]
      summary: Change roles or status of a member
      description: Requires `tenant_admin`. An administrator cannot remove their own administrator role.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Problem"

  /admin/imports:
    post:
      operationId: createImport
      tags: [admin]
      summary: Upload a CSV or XLSX file for import
      description: |
        Parses and validates the file and returns a preview; nothing is written until the
        import is committed. Requires `tenant_admin`. Errors: `import.invalid_file`,
        `import.unknown_columns`, `files.too_large`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  $ref: "#/components/schemas/ImportKind"
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The import preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"

  /admin/imports/{importId}:
    get:
      operationId: getImport
      tags: [admin]
      summary: An import and its preview
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"

  /admin/imports/{importId}/commit:
    post:
      operationId: commitImport
      tags: [admin]
      summary: Apply a previewed import
      description: |
        Valid rows are written; invalid rows are skipped. New students receive an invitation
        letter. Codes of faculties, departments and groups match without regard to case. A file
        grants only the roles `student`, `supervisor`, `mentor` and `jury`. Errors:
        `import.already_committed` (409), `import.too_many_invitations` (429: the university's daily
        allowance of invitation letters would be exceeded; nothing is applied).
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/Problem"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: AI availability for the signed-in member
      description: |
        Whether AI features send data to a provider outside the university (the interface
        must warn), and the member's daily allowance.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        default:
          $ref: "#/components/responses/Problem"

  /admin/ai/settings:
    get:
      operationId: getAiSettings
      tags: [ai]
      summary: AI settings of the university
      description: Requires `tenant_admin`.
      responses:
        "200":
          description: Settings with the configured providers and default routes.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateAiSettings
      tags: [ai]
      summary: Change the AI settings of the university
      description: |
        Requires `tenant_admin`. Routes may name configured providers only; with
        `local_only` every route must stay inside the university network.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsUpdate"
      responses:
        "200":
          description: The saved settings.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        default:
          $ref: "#/components/responses/Problem"

  /admin/ai/check:
    post:
      operationId: checkAiConnection
      tags: [ai]
      summary: Stream a short answer to check a feature's model
      description: |
        Requires `tenant_admin`. Server-sent events: `delta` (`{"text": "..."}`) for each
        piece of the answer, then `done` (AiCheckResult) or `error` (Problem). Closing the
        connection stops the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCheckRequest"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /admin/ai/usage:
    get:
      operationId: getAiUsage
      tags: [ai]
      summary: Tokens and estimated cost of AI calls
      description: Requires `tenant_admin` or `leadership`.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Usage report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageReport"
        default:
          $ref: "#/components/responses/Problem"

  /admin/knowledge:
    get:
      operationId: listKnowledgeDocuments
      tags: [knowledge]
      summary: Documents of the knowledge base
      description: Requires `tenant_admin` or `innovation_manager`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of documents, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createKnowledgeDocument
      tags: [knowledge]
      summary: Add a document
      description: |
        Requires `tenant_admin` or `innovation_manager`. Send a file (PDF, DOCX, TXT or
        Markdown) or pasted text. The document is split into passages and indexed in the
        background; its status turns `ready` when the mentor can cite it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                text:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The document, waiting to be indexed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        default:
          $ref: "#/components/responses/Problem"

  /admin/knowledge/search:
    get:
      operationId: searchKnowledge
      tags: [knowledge]
      summary: Passages that best match a question
      description: Requires `tenant_admin` or `innovation_manager`. The mentor uses the same search.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 500
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching passages, best first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeHit"
        default:
          $ref: "#/components/responses/Problem"

  /admin/knowledge/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKnowledgeDocument
      tags: [knowledge]
      summary: One document
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteKnowledgeDocument
      tags: [knowledge]
      summary: Remove a document and its passages
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /people:
    get:
      operationId: searchPeople
      tags: [profiles]
      summary: Find members of the university
      description: |
        Members by name for adding to a team or mentioning in a comment. Returns
        active members only, at most `limit`.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Role"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        default:
          $ref: "#/components/responses/Problem"

  /incubator/template:
    get:
      operationId: getIncubatorTemplate
      tags: [incubator]
      summary: Stages, steps and fields of the incubator
      description: Texts come in all three languages; the client picks the current one.
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncubatorTemplate"
        default:
          $ref: "#/components/responses/Problem"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Projects
      description: |
        `scope=mine` (default) lists the projects the member takes part in. `scope=all` lists
        every project of the university and requires `innovation_manager`, `tenant_admin`
        or `leadership`.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [mine, all]
            default: mine
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects, the most recently changed first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      tags: [projects]
      summary: Start a project
      description: |
        The creator becomes the owner. When the university has an intellectual property
        policy, `ip_policy_version` must name its current version (`project.ip_policy_required`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      summary: One project
      responses:
        "200":
          description: The project.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Edit the project card
      description: Team members (owner, member) may edit.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: The updated project.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: archiveProject
      tags: [projects]
      summary: Archive the project
      description: The owner or an `innovation_manager` may archive; archived projects are read-only.
      responses:
        "204":
          description: Archived.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: addProjectMember
      tags: [projects]
      summary: Add a member or a supervisor
      description: |
        The owner adds members of the university. A supervisor must have the `supervisor`
        role and may also be assigned by an `innovation_manager`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberAdd"
      responses:
        "201":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateProjectMember
      tags: [projects]
      summary: Change a member's title or hand over ownership
      description: |
        Members edit their own title; the owner edits anyone's and may make another member
        the owner (`role: owner`), becoming a member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberUpdate"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a member or leave the project
      description: The owner removes others; anyone but the owner may leave.
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectActivity
      tags: [projects]
      summary: Recent changes, comments and completed steps
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Activity, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/presence:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: updateProjectPresence
      tags: [projects]
      summary: Report being in the project and see who else is
      description: |
        Clients call it every 15 seconds while the project is open. The answer lists the
        members seen in the last 45 seconds and the current version of every step, so a
        client notices changes made by others.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceUpdate"
      responses:
        "200":
          description: Who is here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presence"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectSteps
      tags: [incubator]
      summary: The state of every step and the progress of the project
      responses:
        "200":
          description: Steps in template order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
    get:
      operationId: getProjectStep
      tags: [incubator]
      summary: The answers of a step
      responses:
        "200":
          description: The step.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProjectStep
      tags: [incubator]
      summary: Save answers
      description: |
        Saves the given fields (others keep their values). `If-Match` is required
        (428 `precondition.required`); a stale version fails with 412 `precondition.failed`,
        and the client merges its edits into the current version. Drafts are saved as typed:
        only types, lengths and options are checked here, the minimum is checked on completion.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpdate"
      responses:
        "200":
          description: The saved step.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}/check:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
    post:
      operationId: checkProjectStep
      tags: [incubator]
      summary: Ask the AI what to strengthen
      description: Reviews the step against its criteria; the review is kept with the step.
      responses:
        "200":
          description: The step with the review.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}/complete:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
    post:
      operationId: completeProjectStep
      tags: [incubator]
      summary: Mark the step done
      description: |
        Fails with 422 `incubator.step_incomplete` (field errors list what is missing) unless
        the minimum requirements are met. A completed step stays editable; when an edit
        breaks the minimum it returns to `in_progress`.
      responses:
        "200":
          description: The completed step.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
    post:
      operationId: approveProjectStep
      tags: [incubator]
      summary: Approve the step as a supervisor
      description: |
        The project's supervisor or an `innovation_manager` approves a step, also one that
        does not meet the minimum, with a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepApprove"
      responses:
        "200":
          description: The approved step.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
    get:
      operationId: listStepRevisions
      tags: [incubator]
      summary: History of the step's fields
      parameters:
        - name: field
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Revisions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
      - $ref: "#/components/parameters/RevisionId"
    post:
      operationId: restoreStepRevision
      tags: [incubator]
      summary: Put an earlier value back
      description: The restored value becomes a new revision; nothing is lost.
      parameters:
        - $ref: "#/components/parameters/IfMatchRequired"
      responses:
        "200":
          description: The step.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{stepKey}/mentor:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepKey"
    get:
      operationId: getMentorConversation
      tags: [incubator]
      summary: The conversation with the AI mentor about the step
      description: Messages oldest first; `cursor` loads earlier ones.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages and the mentor's options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorConversation"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendMentorMessage
      tags: [incubator]
      summary: Ask the mentor and stream the answer
      description: |
        Team members ask; the answer streams as server-sent events: `message` (the saved
        question, MentorMessage), `delta` (`{"text": "..."}`) for each piece, then `done`
        (the saved answer, MentorMessage) or `error` (Problem). Closing the connection stops
        the model; the partial answer is kept as `cancelled`.

        A suggested wording for a field is wrapped in
        `<suggestion field="<field key>">…</suggestion>`; the client shows it with an
        "Apply to the field" button.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorMessageCreate"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectComments
      tags: [incubator]
      summary: Comments
      parameters:
        - name: step_key
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Comments, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProjectComment
      tags: [incubator]
      summary: Comment on a step or a field
      description: The team, the supervisor and innovation managers may comment and @mention each other.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CommentId"
    patch:
      operationId: updateProjectComment
      tags: [incubator]
      summary: Edit or resolve a comment
      description: The author edits the text; anyone who can comment resolves or reopens a thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdate"
      responses:
        "200":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProjectComment
      tags: [incubator]
      summary: Delete a comment
      description: The author or an innovation manager.
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/materials:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMaterials
      tags: [incubator]
      summary: Generated one-pagers, pitch decks and startup passports
      responses:
        "200":
          description: Materials, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProjectMaterial
      tags: [incubator]
      summary: Generate a material from the project data
      description: |
        Generation runs in the background (AI texts, then PDF or PPTX); poll the list until
        the status is `ready`. Pitch decks come as PDF or PPTX, the others as PDF.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialCreate"
      responses:
        "202":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/materials/{materialId}/content:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: getProjectMaterialContent
      tags: [incubator]
      summary: Download a material
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/evaluations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listEvaluations
      tags: [evaluation]
      summary: Evaluation history of a project
      responses:
        "200":
          description: Evaluations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestEvaluation
      tags: [evaluation]
      summary: Ask the AI to evaluate the project
      description: |
        The team, the supervisor or an innovation manager requests an evaluation; it runs in
        the background with the university's rubric. Poll the evaluation until `status` is
        `ready` or `failed`. Limited to a few per project a day (`evaluation.too_many_requests`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/evaluations/{evaluationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EvaluationId"
    get:
      operationId: getEvaluation
      tags: [evaluation]
      summary: One evaluation with the comparison to the previous one
      responses:
        "200":
          description: The evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/evaluations/{evaluationId}/overrides:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EvaluationId"
    post:
      operationId: overrideEvaluationScore
      tags: [evaluation]
      summary: Correct a criterion score as an expert
      description: |
        The project's supervisor or an innovation manager changes the score of a criterion with
        a mandatory comment. The AI score stays visible next to it and the change is recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreOverride"
      responses:
        "200":
          description: The evaluation with the new total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/evaluations/{evaluationId}/report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EvaluationId"
    get:
      operationId: getEvaluationReport
      tags: [evaluation]
      summary: The evaluation report as PDF
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Locale"
      responses:
        "200":
          description: The report.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /admin/rubric:
    get:
      operationId: getRubric
      tags: [evaluation]
      summary: The evaluation rubric of the university
      description: Requires `tenant_admin` or `innovation_manager`.
      responses:
        "200":
          description: Criteria with weights.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rubric"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateRubric
      tags: [evaluation]
      summary: Change the weights of the rubric
      description: Weights are whole numbers adding up to 100. New evaluations use them.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubricUpdate"
      responses:
        "200":
          description: The rubric.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rubric"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/showcase:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getShowcaseEntry
      tags: [showcase]
      summary: The project's showcase page as the team edits it
      description: |
        Before the first save the page is prefilled from the incubator answers (`version` 0).
        Sensitive details are left out when the project hides them.
      responses:
        "200":
          description: The page.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateShowcaseEntry
      tags: [showcase]
      summary: Save the showcase page
      description: |
        The team edits the page. A published page shows the changes at once; moving a page
        to `public` visibility sends it to review (`in_review`) before it is visible outside
        the university.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseEntryUpdate"
      responses:
        "200":
          description: The page.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/showcase/cover:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: setShowcaseCover
      tags: [showcase]
      summary: Upload the cover image
      description: JPEG, PNG or WebP up to 10 MiB; stored as a 1600×900 JPEG without metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The page with the cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteShowcaseCover
      tags: [showcase]
      summary: Remove the cover image
      responses:
        "200":
          description: The page without a cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/showcase/publish:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: publishShowcaseEntry
      tags: [showcase]
      summary: Publish the page
      description: |
        `university` pages are published at once; `public` pages go to an innovation manager
        for review. The page must be saved and have a problem and a solution
        (`showcase.incomplete`).
      responses:
        "200":
          description: The page with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/showcase/unpublish:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: unpublishShowcaseEntry
      tags: [showcase]
      summary: Take the page off the showcase
      responses:
        "200":
          description: The page, back to draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/contacts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectContacts
      tags: [showcase]
      summary: Contact requests addressed to the project
      description: The team sees forwarded requests; innovation managers see all.
      responses:
        "200":
          description: Requests, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/showcase:
    get:
      operationId: listShowcaseReviews
      tags: [showcase]
      summary: Showcase pages for moderation
      description: Requires `innovation_manager` or `tenant_admin`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShowcaseStatus"
      responses:
        "200":
          description: Pages, the oldest submission first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseReviewList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/showcase/{projectId}/review:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: reviewShowcaseEntry
      tags: [showcase]
      summary: Approve or reject a public page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseReview"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseEntry"
        default:
          $ref: "#/components/responses/Problem"

  /admin/contacts:
    get:
      operationId: listContactRequests
      tags: [showcase]
      summary: Contact requests of the university
      description: Requires `innovation_manager` or `tenant_admin`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContactStatus"
      responses:
        "200":
          description: Requests, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestList"
        default:
          $ref: "#/components/responses/Problem"

  /admin/contacts/{contactId}/moderate:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: moderateContactRequest
      tags: [showcase]
      summary: Forward a request to the team or reject it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactModeration"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequest"
        default:
          $ref: "#/components/responses/Problem"

  /showcase:
    get:
      operationId: listShowcase
      tags: [showcase]
      summary: The showcase of published projects
      description: |
        Public. `scope=university` (default) lists the pages of the university of the address
        (members also see `university` pages); `scope=national` lists public pages of every
        university. Full-text search works in Kazakh, Russian and English.
      security: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [university, national]
            default: university
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: industry
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Industry"
        - name: stage
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShowcaseStage"
        - name: faculty
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: need
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ShowcaseNeed"
        - name: tag
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pages, the most recently published first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcasePage"
        default:
          $ref: "#/components/responses/Problem"

  /showcase/facets:
    get:
      operationId: getShowcaseFacets
      tags: [showcase]
      summary: Counts for the showcase filters
      security: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [university, national]
            default: university
      responses:
        "200":
          description: Facets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseFacets"
        default:
          $ref: "#/components/responses/Problem"

  /showcase/highlights:
    get:
      operationId: getShowcaseHighlights
      tags: [showcase]
      summary: Live numbers and featured projects for the landing page
      security: []
      responses:
        "200":
          description: Highlights of the university of the address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseHighlights"
        default:
          $ref: "#/components/responses/Problem"

  /showcase/entries/{slug}:
    parameters:
      - $ref: "#/components/parameters/ShowcaseSlug"
    get:
      operationId: getShowcaseProject
      tags: [showcase]
      summary: A public project page
      description: Public pages are open to everyone; university pages to members only.
      security: []
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseProject"
        default:
          $ref: "#/components/responses/Problem"

  /showcase/entries/{slug}/contact:
    parameters:
      - $ref: "#/components/parameters/ShowcaseSlug"
    post:
      operationId: contactShowcaseProject
      tags: [showcase]
      summary: Ask the team to get in touch
      description: |
        Public and rate-limited. Depending on the university's setting the request goes to an
        innovation manager first or straight to the team; the team's addresses are never shown.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAccepted"
        default:
          $ref: "#/components/responses/Problem"

  /showcase/entries/{slug}/og.png:
    parameters:
      - $ref: "#/components/parameters/ShowcaseSlug"
    get:
      operationId: getShowcaseImage
      tags: [showcase]
      summary: The link preview image of a page (1200×630)
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: qadam_at
      description: |
        Short-lived access token set by sign-in. State-changing requests also need the
        `X-CSRF-Token` header equal to the `qadam_csrf` cookie.
  headers:
    ETag:
      description: Version of the resource; send it back in `If-Match` to update safely.
      schema:
        type: string
    SessionCookies:
      description: "`qadam_at` (access), `qadam_rt` (refresh) and `qadam_csrf` (CSRF token)."
      schema:
        type: string
  parameters:
    ShowcaseSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 60
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being edited; the update fails with 412 if it is stale.
      schema:
        type: string
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepKey:
      name: stepKey
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version being edited; the update fails with 412 if it is stale.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key that makes a creating request safe to retry.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error described in RFC 9457 Problem Details format.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AiFeature:
      type: string
      enum: [mentor, evaluation, generation, summary, embedding]
    MentorMode:
      type: string
      enum: [coach, coauthor]
      description: "`coach` asks and hints; `coauthor` may propose whole texts."
    AiStatus:
      type: object
      additionalProperties: false
      required: [external, daily_limit, used_today, resets_at, mentor_mode]
      properties:
        external:
          type: boolean
          description: AI features send data to a provider outside the university.
        daily_limit:
          type: integer
          description: Tokens a member may use per day; 0 means no limit.
        used_today:
          type: integer
        resets_at:
          type: string
          format: date-time
        mentor_mode:
          $ref: "#/components/schemas/MentorMode"
    AiRoute:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          examples: [anthropic]
        model:
          type: [string, "null"]
          maxLength: 100
          examples: [claude-sonnet-5-5]
    AiRoutes:
      type: object
      description: Providers of each feature in the order they are tried.
      additionalProperties:
        type: array
        maxItems: 5
        items:
          $ref: "#/components/schemas/AiRoute"
    AiProvider:
      type: object
      additionalProperties: false
      required: [name, local, models]
      properties:
        name:
          type: string
        local:
          type: boolean
          description: Runs inside the university network; data is not redacted.
        models:
          type: object
          description: Default model per feature.
          additionalProperties:
            type: string
    AiSettings:
      type: object
      additionalProperties: false
      required: [routes, default_routes, providers, local_only, daily_user_tokens, daily_tenant_tokens, mentor_mode]
      properties:
        routes:
          $ref: "#/components/schemas/AiRoutes"
        default_routes:
          $ref: "#/components/schemas/AiRoutes"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AiProvider"
        local_only:
          type: boolean
        daily_user_tokens:
          type: integer
        daily_tenant_tokens:
          type: integer
          format: int64
        mentor_mode:
          $ref: "#/components/schemas/MentorMode"
    AiSettingsUpdate:
      type: object
      additionalProperties: false
      required: [routes, local_only, daily_user_tokens, daily_tenant_tokens, mentor_mode]
      properties:
        routes:
          $ref: "#/components/schemas/AiRoutes"
        local_only:
          type: boolean
        daily_user_tokens:
          type: integer
          minimum: 0
          maximum: 100000000
        daily_tenant_tokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000
        mentor_mode:
          $ref: "#/components/schemas/MentorMode"
    AiCheckRequest:
      type: object
      additionalProperties: false
      required: [feature]
      properties:
        feature:
          $ref: "#/components/schemas/AiFeature"
        locale:
          $ref: "#/components/schemas/Locale"
    AiCheckResult:
      type: object
      additionalProperties: false
      required: [provider, model, prompt_version, input_tokens, output_tokens]
      properties:
        provider:
          type: string
        model:
          type: string
        prompt_version:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
    AiUsageTotals:
      type: object
      additionalProperties: false
      required: [requests, input_tokens, output_tokens, cost_usd]
      properties:
        requests:
          type: integer
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
    AiUsageByFeature:
      type: object
      additionalProperties: false
      required: [feature, requests, input_tokens, output_tokens, cost_usd, failures]
      properties:
        feature:
          $ref: "#/components/schemas/AiFeature"
        requests:
          type: integer
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
        failures:
          type: integer
    AiUsageByDay:
      type: object
      additionalProperties: false
      required: [day, requests, tokens, cost_usd]
      properties:
        day:
          type: string
          format: date
        requests:
          type: integer
        tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
    AiUsageByModel:
      type: object
      additionalProperties: false
      required: [provider, model, requests, tokens, cost_usd]
      properties:
        provider:
          type: string
        model:
          type: string
        requests:
          type: integer
        tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
    AiUsageReport:
      type: object
