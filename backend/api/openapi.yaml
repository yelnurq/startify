    MemberUpdate:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [active, suspended]

    ImportKind:
      type: string
      description: |
        `structure` — faculties, departments and study groups;
        `students` — students with their faculty, group and course.
      enum: [structure, students]
    ImportStatus:
      type: string
      enum: [preview, committed]
    ImportRowAction:
      type: string
      enum: [create, update, skip]
    ImportRow:
      type: object
      additionalProperties: false
      required: [line, values, action, errors]
      properties:
        line:
          type: integer
          description: Line number in the file (1 is the header).
        values:
          type: object
          additionalProperties:
            type: string
        action:
          $ref: "#/components/schemas/ImportRowAction"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ImportSummary:
      type: object
      additionalProperties: false
      required: [total, valid, invalid, to_create, to_update]
      properties:
        total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        to_create:
          type: integer
        to_update:
          type: integer
    ImportJob:
      type: object
      additionalProperties: false
      required: [id, kind, status, file_name, columns, summary, rows, created_at, committed_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ImportKind"
        status:
          $ref: "#/components/schemas/ImportStatus"
        file_name:
          type: string
        columns:
          type: array
          items:
            type: string
        summary:
          $ref: "#/components/schemas/ImportSummary"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"
        created_at:
          type: string
          format: date-time
        committed_at:
          type: [string, "null"]
          format: date-time
    ImportResult:
      type: object
      additionalProperties: false
      required: [created, updated, skipped, invited]
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        invited:
          type: integer

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON pointer-like path of the invalid field, e.g. `steps.problem.statement`.
        code:
          type: string
          description: Stable validation code, e.g. `required`, `too_short`.
        message:
          type: string
          description: English, developer-facing explanation.
        params:
          type: object
          additionalProperties: true
          description: Values for interpolation into the localised message.
    Problem:
      type: object
      description: RFC 9457 Problem Details extended with a localisable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code used for localisation.
          examples: [auth.invalid_credentials]
        request_id:
          type: string
        params:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
