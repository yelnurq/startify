<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;color:#0b1220;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Preheader}}</span>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f9;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 20px;">
            <table role="presentation" cellspacing="0" cellpadding="0">
              <tr>
                <td style="width:32px;height:32px;border-radius:9px;background:#007591;text-align:center;vertical-align:middle;color:#ffffff;font-weight:700;font-size:16px;">Q</td>
                <td style="padding-left:10px;font-size:18px;font-weight:700;color:#0b1220;">Qadam</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e6e9ef;border-radius:16px;padding:32px;">
            <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#0b1220;">{{.Heading}}</h1>
            {{range .Paragraphs}}<p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#4a5568;">{{.}}</p>{{end}}
            {{if .Code}}
            <div style="margin:20px 0;padding:18px;border-radius:12px;background:#ebfbff;border:1px solid #b1ebfa;text-align:center;font-size:32px;letter-spacing:10px;font-weight:700;color:#005e76;font-family:'Cascadia Code',Consolas,monospace;">{{.Code}}</div>
            {{end}}
            {{if .Button}}
            <table role="presentation" cellspacing="0" cellpadding="0" style="margin:24px 0;">
              <tr>
                <td style="border-radius:12px;background:#007591;">
                  <a href="{{.Link}}" style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:12px;">{{.Button}}</a>
                </td>
              </tr>
            </table>
            <p style="margin:0 0 14px;font-size:12px;line-height:1.5;color:#667085;word-break:break-all;">{{.Link}}</p>
            {{end}}
            {{if .After}}<p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#667085;">{{.After}}</p>{{end}}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 4px 0;font-size:12px;line-height:1.5;color:#8a94a6;">{{.Footer}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
