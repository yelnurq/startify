name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools.sum
      - name: Generated code is up to date
        run: |
          go tool -modfile=tools.mod oapi-codegen -config oapi-codegen.yaml api/openapi.yaml
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code -- internal/
      - name: Lint
        run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: Test (unit and integration, race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  frontend:
    name: Frontend · lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/shared/api/schema.gen.ts
      - name: Type check
        run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end · Playwright against docker compose
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build --wait api worker web
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: npm ci --no-fund --no-audit && npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color api worker web migrate
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  images:
    name: Docker images
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: false
          build-args: |
            VERSION=0.1.0
            COMMIT=${{ github.sha }}
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
