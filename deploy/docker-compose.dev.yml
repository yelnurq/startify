# Development additions to docker-compose.yml, for a developer's machine only.
# `make dev` and `make infra` use both files:
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
#
# - Infrastructure ports on DEV_BIND (127.0.0.1 by default), for running the
#   API, the worker and Vite natively and for looking inside the services.
# - Mailpit catches every outgoing letter: http://localhost:8025.
#
# Never use this file on a server: Mailpit shows every sign-in code and
# password reset link to whoever opens it, and the ports bypass Nginx.

x-dev-mail: &dev-mail
  QADAM_SMTP_HOST: ${SMTP_HOST:-mailpit}
  QADAM_SMTP_PORT: ${SMTP_PORT:-1025}
  QADAM_SMTP_TLS: ${SMTP_TLS:-none}

services:
  postgres:
    ports:
      - "${DEV_BIND:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"

  valkey:
    ports:
      - "${DEV_BIND:-127.0.0.1}:${VALKEY_PORT:-63799}:6379"

  minio:
    ports:
      - "${DEV_BIND:-127.0.0.1}:${MINIO_PORT:-9900}:9000"
      - "${DEV_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9901}:9001"

  gotenberg:
    ports:
      - "${DEV_BIND:-127.0.0.1}:${GOTENBERG_PORT:-3300}:3000"

  clamav:
    ports:
      - "${DEV_BIND:-127.0.0.1}:${CLAMAV_PORT:-33100}:3310"

  api:
    environment: *dev-mail
    ports:
      - "${DEV_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

  worker:
    environment: *dev-mail

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${DEV_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
      - "${DEV_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
