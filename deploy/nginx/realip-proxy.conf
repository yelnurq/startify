# Production (docker-compose.prod.yml): Caddy is the only way in and sets
# X-Forwarded-For to the client's address. Nginx takes the address from that
# header for requests from the internal Docker network, so the API's rate
# limits and the audit log see the client, not Caddy. The web container is not
# published in production, so no one outside reaches Nginx directly.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
