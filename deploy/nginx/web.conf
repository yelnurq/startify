# Docker's DNS: the address of the api service is looked up again when the
# container is recreated, instead of being fixed at nginx start-up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream qadam_api {
  zone qadam_api 64k;
  server api:8080 resolve;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 30m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # API, including server-sent event streams (no buffering, long reads).
  location /api/ {
    proxy_pass http://qadam_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port: the API compares it with the Origin header.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Showcase pages, the sitemap and robots.txt come from the API: it puts the
  # page's title, description, link preview and structured data into the web
  # client's index.html. The API's own security headers give way to the web
  # client's; if the API is down, the plain web client opens instead.
  location ~ ^/(showcase(/[^/]*)?|sitemap\.xml|robots\.txt)$ {
    proxy_pass http://qadam_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;
    include /etc/nginx/snippets/security-headers.conf;
    error_page 502 503 504 = @spa;
  }

  location @spa {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Fingerprinted build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page application: unknown paths render index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
