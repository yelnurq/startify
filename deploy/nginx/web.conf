# Docker's DNS: the address of the api service is looked up again when the
# container is recreated, instead of being fixed at nginx start-up.
resolver 127.0.0.11 valid=10s ipv6=off;

# The access log leaves out query strings: links in letters carry one-time
# tokens (?token=...), SSO callbacks carry codes. The Referer of a page opened
# from such a link repeats them, so it is not logged either. $request_id is
# the X-Request-ID that the API writes in its own log.
map $request_uri $qadam_path {
  "~^(?<path>[^?]*)" $path;
}
log_format qadam '$remote_addr [$time_local] "$request_method $qadam_path $server_protocol" '
                 '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';

upstream qadam_api {
  zone qadam_api 64k;
  server api:8080 resolve;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 30m;
  access_log /var/log/nginx/access.log qadam;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # The API takes the client's address from X-Forwarded-For and trusts this
  # one hop. Nginx sets the header to the address it sees and never appends
  # to what the client sent, so a client cannot add entries of its own. In
  # production Caddy terminates HTTPS in front of this container, and this
  # snippet (realip-proxy.conf there) first restores the client's address
  # from Caddy's header; elsewhere it is empty.
  include /etc/nginx/snippets/realip.conf;

  # API, including server-sent event streams (no buffering, long reads).
  location /api/ {
    proxy_pass http://qadam_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port: the API compares it with the Origin header.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # The home page, showcase pages, the sitemap and robots.txt come from the
  # API: it puts the page's title, description, link preview, structured data
  # and a first screen drawn on the server into the web client's index.html.
  # The API's own security headers give way to the web client's; if the API
  # is down, the plain web client opens instead.
  location ~ ^/(showcase(/[^/]*)?|sitemap\.xml|robots\.txt)?$ {
    proxy_pass http://qadam_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;
    include /etc/nginx/snippets/security-headers.conf;
    error_page 502 503 504 = @spa;
  }

  location @spa {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Fingerprinted build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page application: unknown paths render index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
