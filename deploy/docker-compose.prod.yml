# Production layer over docker-compose.yml. Caddy terminates HTTPS on 80/443
# and is the only published service; every container's log is rotated.
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# or `make prod-up`. Installation guide: docs/OPERATIONS.md; .env comes from
# deploy/scripts/prod-init.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      QADAM_DOMAIN: ${QADAM_DOMAIN:?set QADAM_DOMAIN in .env (deploy/scripts/prod-init.sh)}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS in .env (deploy/scripts/prod-init.sh)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The university's own certificate, when CADDY_TLS names files.
      - ./certs:/certs:ro
      # Certificates and their keys: keep this volume, Let's Encrypt limits
      # how often a name gets a new certificate.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  web:
    # Only Caddy reaches the web container.
    ports: !reset []
    volumes:
      - ./nginx/realip-proxy.conf:/etc/nginx/snippets/realip.conf:ro
    logging: *logging

  api:
    logging: *logging
  worker:
    logging: *logging
  migrate:
    logging: *logging
  db-roles:
    logging: *logging
  postgres:
    logging: *logging
  valkey:
    logging: *logging
  minio:
    logging: *logging
  minio-init:
    logging: *logging
  gotenberg:
    logging: *logging
  clamav:
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
